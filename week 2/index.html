
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 2/title>

<style>
:root {
  --pink: #f8dce8;
  --light: #fff7fb;
  --accent: #e9a9c3;
  --dark: #a95679;
  --text: #624354;
  --muted: #956f82;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 32px 20px;
  font-family: "Segoe UI", Arial, sans-serif;
  color: var(--text);
  background-color: var(--pink);
  background-image: radial-gradient(white 2px, transparent 2.5px);
  background-size: 26px 26px;
}

.container {
  max-width: 1050px;
  margin: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 28px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 15px;
}

.folder {
  position: relative;
  width: 55px;
  height: 43px;
  flex-shrink: 0;
  border-radius: 8px;
  background: linear-gradient(145deg, #f5bfd5, #e99dbd);
  box-shadow: inset 0 2px 4px #ffffffaa;
}

.folder::before {
  content: "";
  position: absolute;
  top: -7px;
  left: 4px;
  width: 26px;
  height: 10px;
  border-radius: 6px 6px 0 0;
  background: #f0b4ce;
}

h1 {
  margin: 0;
  font-family: Georgia, serif;
  font-size: clamp(26px, 4vw, 36px);
}

.subtitle {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 14px;
}

.badge {
  padding: 9px 13px;
  border: 1px solid #e7afc7;
  border-radius: 30px;
  background: var(--light);
  color: var(--dark);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
}

.hero {
  position: relative;
  overflow: hidden;
  padding: clamp(25px, 5vw, 45px);
  border: 1px solid #edbfd2;
  border-radius: 23px;
  background: #fff7fbf2;
  box-shadow: 0 10px 30px #a85b7c12;
}

.eyebrow {
  color: var(--dark);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 2px;
}

.hero h2 {
  max-width: 650px;
  margin: 15px 0 12px;
  font-family: Georgia, serif;
  font-size: clamp(30px, 5vw, 46px);
  line-height: 1.1;
}

.hero p {
  max-width: 600px;
  color: var(--muted);
  line-height: 1.8;
  font-size: 15px;
}

.heart {
  position: absolute;
  right: 35px;
  top: 25px;
  color: #e9a9c3;
  font-size: 65px;
  transform: rotate(10deg);
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 32px 2px 16px;
}

.section-heading h2 {
  margin: 0;
  font-family: Georgia, serif;
  font-size: 25px;
}

.section-heading span {
  color: var(--muted);
  font-size: 12px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.card {
  display: flex;
  flex-direction: column;
  min-height: 175px;
  padding: 22px;
  border: 1px solid #edbfd2;
  border-radius: 18px;
  background: #fffafd;
  color: inherit;
  text-decoration: none;
  transition: .2s ease;
}

.card:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: 0 12px 25px #a85b7c20;
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.icon {
  display: grid;
  place-items: center;
  width: 43px;
  height: 43px;
  border-radius: 13px;
  background: #fce9f1;
  font-size: 22px;
}

.arrow {
  color: var(--dark);
  font-size: 22px;
}

.card h3 {
  margin: 18px 0 7px;
  font-family: Georgia, serif;
  font-size: 21px;
}

.card p {
  margin: 0 0 17px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.filename {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px dashed #efd3df;
  color: var(--dark);
  font: 12px Consolas, monospace;
}

.notebook {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 18px;
  padding: 19px;
  border: 1px dashed #df9fba;
  border-radius: 15px;
  background: #fff7fb;
  color: var(--muted);
  font-size: 13px;
}

.notebook a {
  color: var(--dark);
  font-weight: bold;
  text-decoration: none;
}

.notebook a:hover {
  text-decoration: underline;
}

footer {
  margin-top: 32px;
  padding-top: 18px;
  border-top: 1px solid #e9bcd0;
  color: var(--muted);
  text-align: center;
  font-size: 10px;
  letter-spacing: 1.5px;
}

@media (max-width: 600px) {
  body {
    padding: 22px 13px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .heart {
    right: 15px;
    opacity: .5;
  }

  .hero p {
    max-width: 95%;
  }
}
</style>
</head>
