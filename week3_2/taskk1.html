<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My CSS Portfolio</title>
  <style>
    /* 1. Reset */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* 2. Base */
    body { font-family: 'Segoe UI', sans-serif; font-size: 1rem; line-height: 1.6; color: #1e293b; }
    a    { text-decoration: none; }
    h1   { font-size: 2.5rem; }
    h2   { font-size: 1.75rem; margin-bottom: 24px; }
    h3   { font-size: 1.1rem; margin-bottom: 8px; color: #15803d; }
    p    { color: #475569; }

    /* 3. Navigation */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1e293b;
      padding: 16px 40px;
    }
    .nav-logo { color: #10B981; font-weight: 700; font-size: 1.3rem; }
    .nav-links { display: flex; gap: 24px; }
    .nav-links a { color: #94a3b8; font-size: 0.9rem; }
    .nav-links a:hover { color: #10B981; }

    /* 4. Hero */
    .hero {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      padding: 100px 40px;
      text-align: center;
    }
    .hero h1 { color: #15803d; margin-bottom: 16px; }
    .hero p  { font-size: 1.15rem; margin-bottom: 32px; color: #475569; }
    .btn {
      display: inline-block;
      background-color: #15803d;
      color: white;
      padding: 14px 32px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
    }
    .btn:hover { background-color: #166534; }

    /* 5. Skills grid */
    .skills-section { padding: 80px 40px; max-width: 900px; margin: 0 auto; }
    .skills-grid {
      display: flex;
      gap: 20px;
    }
    .skill-card {
      flex: 1;
      background: #ffffff;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 28px;
    }
    .skill-card p { font-size: 0.9rem; }

    /* 6. Footer */
    .footer {
      background-color: #1e293b;
      color: #94a3b8;
      text-align: center;
      padding: 28px;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <span class="nav-logo">MyPortfolio</span>
    <div class="nav-links">
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
  .card {
    width: 280px;
    height: 180px;
    background: white;
    border: 2px solid #14b8a6;
    border-radius: 12px;
    position: relative;
    margin: 40px;
  }
  .badge {
    position: absolute;
    top: -12px;
    right: 16px;
    background: #0f766e;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">SALE</span>
    <p style="padding:16px;color:#0f766e;font-weight:bold">Card content here</p>
  </div>
</body>
</html>
