<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open-Meteo Weather Lookup</title>

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">

<style>
  :root { --paper:#fbf9f1; --ink:#1a1212; --pink:#f4c9e2; --butter:#f8ebb5; --maroon:#6b0f1a; --brown:#4a1f1d; --tile:#f3efe2; --line:#e3ddcb; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--pink); color:var(--ink); font-family:"Instrument Serif",Georgia,serif; font-size:20px; }
  .card { min-height:100vh; padding:56px clamp(20px, 8vw, 120px); background:var(--paper); text-align:center; }
  .wrap { max-width:820px; margin:0 auto; }
  .meta { display:flex; justify-content:space-between; font-size:12px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:14px; }
  h1 { font-weight:400; font-size:clamp(2rem,7vw,3rem); line-height:1.1; margin:0 0 8px; }
  h1 .script { font-family:"Pinyon Script",cursive; font-size:1.2em; color:var(--maroon); }
  .sub { margin:0 0 24px; font-size:17px; }

  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:12px; }
  input, button { font:inherit; padding:9px 18px; border:1px solid var(--ink); border-radius:99px; color:var(--ink); }
  input { background:#fff; min-width:240px; }
  button { background:var(--butter); cursor:pointer; }
  button:hover { background:var(--brown); color:var(--paper); }
  .chips button { font-size:15px; padding:3px 14px; border-style:dashed; }
  #msg { min-height:1.4em; color:var(--maroon); margin:10px 0 18px; }

  .panel { background:#fff; border:1px solid var(--line); border-radius:22px; padding:28px; text-align:left; box-shadow:0 8px 24px rgba(107,15,26,.08); }
  .place { font-size:1.7rem; line-height:1.1; }
  .date { font-size:15px; color:#6b6262; margin-bottom:18px; }
  .now { display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:22px; }
  .icon { font-size:4.2rem; line-height:1; }
  .temp { font-size:4.6rem; line-height:1; letter-spacing:-.03em; }
  .desc { font-size:1.3rem; color:var(--maroon); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px; }
  .tile { background:var(--tile); border-radius:14px; padding:12px 16px; }
  .tile small { display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#6b6262; }
  .tile b { font-weight:400; font-size:1.5rem; }
  h2 { font-weight:400; font-size:1rem; letter-spacing:.08em; text-transform:uppercase; margin:0 0 10px; color:#6b6262; }
  .days { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; }
  .day { text-align:center; border:1px solid var(--line); border-radius:14px; padding:12px 6px; }
  .day .d { font-size:1rem; }
  .day .e { font-size:2rem; margin:4px 0; }
  .day .t { font-size:1rem; }
  .day .t span { color:#6b6262; }
  .back { display:inline-block; margin-top:28px; font-size:16px; color:var(--maroon); }
</style>
</head>
<body>
<div class="card"><div class="wrap">
  <div class="meta"><span>06.03 &middot; Fetch API</span><span>Open-Meteo</span></div>
  <h1>Weather <span class="script">Lookup</span></h1>
  <p class="sub">Search any city for current conditions and a 5-day forecast.</p>

  <div class="row">
    <input id="q" placeholder="Enter a city, e.g. Seoul" aria-label="City name">
    <button id="go">Search</button>
  </div>
  <div class="row chips">
    <button>Seoul</button><button>Tokyo</button><button>London</button><button>New York</button>
  </div>

  <p id="msg"></p>
  <div id="out"></div>

  <a class="back" href="index.html">&larr; Back to Week 6</a>
</div></div>

<script>
const q = document.getElementById("q");
const msg = document.getElementById("msg");
const out = document.getElementById("out");

// Turn Open-Meteo's weather code into words and an emoji
function describe(c) {
  if (c === 0) return ["Clear sky", "☀️"];
  if (c <= 2) return ["Partly cloudy", "⛅"];
  if (c === 3) return ["Overcast", "☁️"];
  if (c <= 48) return ["Fog", "🌫️"];
  if (c <= 57) return ["Drizzle", "🌦️"];
  if (c <= 67) return ["Rain", "🌧️"];
  if (c <= 77) return ["Snow", "❄️"];
  if (c <= 82) return ["Rain showers", "🌦️"];
  if (c <= 86) return ["Snow showers", "❄️"];
  return ["Thunderstorm", "⛈️"];
}

// Keeps text from the internet from being treated as HTML
function esc(s) {
  return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}

async function search() {
  const city = q.value.trim();
  if (!city) return;
  msg.textContent = "Looking up " + city + "...";
  out.innerHTML = "";
  try {
    // Step 1: city name -> coordinates
    const geoRes = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + encodeURIComponent(city));
    const geo = await geoRes.json();
    if (!geo.results) { msg.textContent = "City not found. Check the spelling and try again."; return; }
    const place = geo.results[0];

    // Step 2: coordinates -> current weather + 5-day forecast
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + place.latitude +
      "&longitude=" + place.longitude +
      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=5&timezone=auto";
    const w = await (await fetch(url)).json();
    const c = w.current;
    const [text, icon] = describe(c.weather_code);

    const days = w.daily.time.map((d, i) => {
      const [, e] = describe(w.daily.weather_code[i]);
      const name = new Date(d).toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" });
      return `<div class="day"><div class="d">${name}</div><div class="e">${e}</div>
        <div class="t">${Math.round(w.daily.temperature_2m_max[i])}° <span>${Math.round(w.daily.temperature_2m_min[i])}°</span></div></div>`;
    }).join("");

    out.innerHTML = `
      <div class="panel">
        <div class="place">${esc(place.name)}, ${esc(place.country || "")}</div>
        <div class="date">${new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })}</div>
        <div class="now">
          <div class="icon">${icon}</div>
          <div class="temp">${Math.round(c.temperature_2m)}°C</div>
          <div class="desc">${text}</div>
        </div>
        <div class="stats">
          <div class="tile"><small>Feels like</small><b>${Math.round(c.apparent_temperature)}°C</b></div>
          <div class="tile"><small>Humidity</small><b>${c.relative_humidity_2m}%</b></div>
          <div class="tile"><small>Wind</small><b>${c.wind_speed_10m} km/h</b></div>
        </div>
        <h2>5-day forecast</h2>
        <div class="days">${days}</div>
      </div>`;
    msg.textContent = "";
  } catch (err) {
    console.error(err);
    msg.textContent = "Something went wrong: " + err.message;
  }
}

document.getElementById("go").addEventListener("click", search);
q.addEventListener("keydown", e => { if (e.key === "Enter") search(); });
// Quick-pick city buttons
document.querySelectorAll(".chips button").forEach(b => {
  b.addEventListener("click", () => { q.value = b.textContent; search(); });
});
</script>
</body>
</html>
