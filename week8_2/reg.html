<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form v2 | Aaditi</title>

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">

<style>
  :root { --paper:#fbf9f1; --ink:#1a1212; --pink:#f4c9e2; --butter:#f8ebb5; --maroon:#6b0f1a; --brown:#4a1f1d; --error:#b3261e; --ok:#1e6b34; --line:#8c8272; }
  * { box-sizing: border-box; }
  body { margin:0; padding:40px 20px; background:var(--pink); color:var(--ink); font-family:"Instrument Serif",Georgia,serif; font-size:20px; line-height:1.4; }
  .card { max-width:560px; margin:0 auto; padding:40px 32px 44px; background:var(--paper); }
  h1 { font-weight:400; font-size:clamp(2rem,7vw,3rem); line-height:1.1; margin:0 0 8px; text-align:center; }
  h1 .script { font-family:"Pinyon Script",cursive; font-size:1.2em; color:var(--maroon); }
  .sub { text-align:center; margin:0 0 24px; font-size:17px; }
  :focus-visible { outline:3px solid var(--maroon); outline-offset:3px; }

  .field { margin-bottom:18px; }
  label { display:block; margin-bottom:4px; }
  input { width:100%; font:inherit; padding:9px 14px; background:#fff; color:var(--ink); border:2px solid var(--line); border-radius:12px; }
  input[aria-invalid="true"] { border-color:var(--error); }
  input.valid { border-color:var(--ok); }
  .hint { display:block; font-size:15px; margin-top:4px; color:#5b5252; }
  .error { display:block; min-height:1.2em; margin-top:4px; font-size:16px; color:var(--error); }

  button { width:100%; font:inherit; padding:10px 18px; background:var(--butter); color:var(--ink); border:1px dashed var(--ink); border-radius:99px; cursor:pointer; }
  button:hover:not(:disabled) { background:var(--brown); color:var(--paper); }
  button:disabled { opacity:.55; cursor:not-allowed; }

  .success { margin-top:18px; padding:12px 16px; background:#e3f3e6; color:#14502a; border:1px solid var(--ok); border-radius:12px; }
  .success:empty { display:none; }
  .back { display:block; margin-top:24px; text-align:center; font-size:17px; color:var(--maroon); }
</style>
</head>
<body>
<main>
<div class="card">
  <h1>Registration <span class="script">Form</span></h1>
  <p class="sub">Create an account. Each field is checked as you type.</p>

  <!-- 1. novalidate turns off the browser's own pop-up bubbles, so our JavaScript shows the errors -->
  <form id="regForm" novalidate>

    <div class="field">
      <label for="name">Full name</label>
      <!-- 4. aria-describedby links the input to its error message; aria-invalid says if it is currently wrong -->
      <input id="name" name="name" type="text" required minlength="2" autocomplete="name" aria-describedby="name-error" aria-invalid="false">
      <span class="error" id="name-error" aria-live="polite"></span>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" aria-describedby="email-error" aria-invalid="false">
      <span class="error" id="email-error" aria-live="polite"></span>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="8" pattern="(?=.*[A-Za-z])(?=.*\d).{8,}" autocomplete="new-password" aria-describedby="password-hint password-error" aria-invalid="false">
      <span class="hint" id="password-hint">At least 8 characters, with a letter and a number.</span>
      <span class="error" id="password-error" aria-live="polite"></span>
    </div>

    <div class="field">
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" required autocomplete="new-password" aria-describedby="confirm-error" aria-invalid="false">
      <span class="error" id="confirm-error" aria-live="polite"></span>
    </div>

    <!-- Bonus: this button stays disabled until the whole form is valid -->
    <button type="submit" id="submitBtn" disabled>Create account</button>

    <!-- 6. Success message div (empty until the form is submitted successfully) -->
    <div id="success" class="success" role="status" aria-live="polite"></div>
  </form>

  <a class="back" href="index.html">&larr; Back to Week 8</a>
</div>
</main>

<script>
const form = document.getElementById("regForm");
const nameInput = document.getElementById("name");
const password = document.getElementById("password");
const confirmInput = document.getElementById("confirm");
const submitBtn = document.getElementById("submitBtn");
const success = document.getElementById("success");
const fields = Array.from(form.querySelectorAll("input"));
const touched = new Set();   // fields the user has interacted with

// 5. Password confirm: setCustomValidity("text") marks the field invalid, setCustomValidity("") clears it
function checkMatch() {
  if (confirmInput.value && confirmInput.value !== password.value) {
    confirmInput.setCustomValidity("Passwords do not match.");
  } else {
    confirmInput.setCustomValidity("");
  }
}

// 3. The validity API tells us exactly what is wrong with a field
function messageFor(input) {
  const v = input.validity;
  if (v.valueMissing) return "This field is required.";
  if (v.typeMismatch) return "Enter a valid email address, like name@example.com.";
  if (v.tooShort) return "Must be at least " + input.minLength + " characters (you have " + input.value.length + ").";
  if (v.patternMismatch) return "Use at least 8 characters with a letter and a number.";
  if (v.customError) return input.validationMessage;
  return "";
}

// Show or clear the error text and update aria-invalid
function showState(input) {
  const err = document.getElementById(input.id + "-error");
  const msg = messageFor(input);
  err.textContent = msg;
  input.setAttribute("aria-invalid", msg ? "true" : "false");
  input.classList.toggle("valid", !msg && input.value !== "");
}

// Bonus: only enable Submit when form.checkValidity() is true
function updateButton() {
  submitBtn.disabled = !form.checkValidity();
}

// Input listeners for ALL fields
fields.forEach(input => {
  input.addEventListener("input", () => {
    success.textContent = "";
    touched.add(input);
    checkMatch();
    touched.forEach(showState);   // re-check every touched field (confirm changes when password changes)
    updateButton();
  });
  input.addEventListener("blur", () => {
    touched.add(input);
    checkMatch();
    showState(input);
  });
});

// 2. preventDefault stops the normal submit so we can run our own checks first
form.addEventListener("submit", e => {
  e.preventDefault();
  checkMatch();
  fields.forEach(f => { touched.add(f); showState(f); });

  if (!form.checkValidity()) {
    fields.find(f => !f.validity.valid).focus();   // send focus to the first problem
    return;
  }

  success.textContent = "Thanks, " + nameInput.value.trim() + "! Your account has been created.";
  form.reset();
  touched.clear();
  fields.forEach(f => { document.getElementById(f.id + "-error").textContent = ""; f.setAttribute("aria-invalid", "false"); f.classList.remove("valid"); });
  updateButton();
});

updateButton();
</script>
</body>
</html>
