<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Color Palette</title>
<style>
  :root {
    --bg: #f5f6f8;
    --ink: #1d2433;
    --muted: #5b6577;
    --line: #d5d9e2;
    --accent: #2f5bea;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141821;
      --ink: #eef1f7;
      --muted: #9aa4b8;
      --line: #2c3444;
      --accent: #7f9cff;
      --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 20px 48px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 2rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  .hint { margin: 0 0 24px; color: var(--muted); max-width: 60ch; line-height: 1.5; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
  .controls input[type="text"] {
    flex: 1 1 200px;
    padding: 10px 12px;
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--line);
    border-radius: 8px;
  }
  button {
    padding: 10px 16px;
    font: inherit;
    font-weight: 600;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--ink);
    border-radius: 8px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:hover { opacity: 0.88; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #message { min-height: 1.4em; margin: 0 0 18px; font-size: 0.9rem; color: var(--error); }

  #palette {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-start;
  }
  .box {
    width: 120px;
    height: 120px;
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid rgba(0, 0, 0, 0.12);
    cursor: pointer;
    user-select: none;
    font-weight: 700;
    letter-spacing: 0.02em;
    transition: width 0.35s ease, height 0.35s ease, transform 0.2s ease;
  }
  .box.expanded {
    width: 260px;
    height: 200px;
    font-size: 1.3rem;
  }
  .empty { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .box { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Interactive Color Palette</h1>
  <p class="hint">Click a box to expand it and see its hex code. Double-click a box to remove it. Your palette is saved in this browser.</p>

  <div class="controls">
    <input type="text" id="hexInput" placeholder="Hex color, e.g. #ff6b35" aria-label="Hex color" autocomplete="off">
    <button type="button" id="addBtn" class="primary">Add Color</button>
    <button type="button" id="exportBtn">Export PNG</button>
    <button type="button" id="resetBtn">Reset</button>
  </div>
  <p id="message" role="status"></p>

  <div id="palette"></div>
</main>

<script>
  const STORAGE_KEY = "colorPalette.v1";
  const DEFAULT_COLORS = ["#E63946", "#FFB6C1", "#E9C46A", "#00C8E0", "#457B9D", "#6D597A"];

  const paletteEl = document.getElementById("palette");
  const inputEl = document.getElementById("hexInput");
  const messageEl = document.getElementById("message");

  let colors = loadColors();

  // ---------- storage ----------
  function loadColors() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(saved)) return saved;
    } catch (e) { /* storage unavailable or corrupted */ }
    return DEFAULT_COLORS.slice();
  }

  function saveColors() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(colors));
    } catch (e) { /* ignore */ }
  }

  // ---------- helpers ----------
  function normalizeHex(value) {
    let v = value.trim().replace(/^#/, "");
    if (!/^([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)) return null;
    if (v.length === 3) v = v.split("").map(c => c + c).join("");
    return "#" + v.toUpperCase();
  }

  function textColorFor(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.6 ? "#111111" : "#ffffff";
  }

  function showMessage(text) {
    messageEl.textContent = text;
  }

  // ---------- rendering ----------
  function render() {
    paletteEl.innerHTML = "";
    if (colors.length === 0) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "No colors yet. Enter a hex code and select Add Color.";
      paletteEl.appendChild(p);
      return;
    }
    colors.forEach((hex, index) => paletteEl.appendChild(createBox(hex, index)));
  }

  function createBox(hex, index) {
    const box = document.createElement("div");
    box.className = "box";
    box.style.backgroundColor = hex;
    box.style.color = textColorFor(hex);
    box.tabIndex = 0;
    box.setAttribute("role", "button");
    box.setAttribute("aria-label", "Color " + hex + ". Click to expand, double-click to remove.");

    // Click: expand and show hex code
    box.addEventListener("click", () => {
      box.classList.toggle("expanded");
      box.textContent = box.classList.contains("expanded") ? hex : "";
    });

    // Keyboard: Enter/Space expands, Delete removes
    box.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); box.click(); }
      if (e.key === "Delete" || e.key === "Backspace") { removeColor(index); }
    });

    // Double-click: remove
    box.addEventListener("dblclick", () => removeColor(index));

    return box;
  }

  function removeColor(index) {
    colors.splice(index, 1);
    saveColors();
    render();
  }

  // ---------- add color ----------
  function addColor() {
    const hex = normalizeHex(inputEl.value);
    if (!hex) {
      showMessage("Enter a valid hex color, like #ff6b35 or #f63.");
      return;
    }
    showMessage("");
    colors.push(hex);
    saveColors();
    render();
    inputEl.value = "";
    inputEl.focus();
  }

  document.getElementById("addBtn").addEventListener("click", addColor);
  inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") addColor(); });

  // ---------- reset ----------
  document.getElementById("resetBtn").addEventListener("click", () => {
    colors = DEFAULT_COLORS.slice();
    saveColors();
    showMessage("");
    render();
  });

  // ---------- export as PNG ----------
  document.getElementById("exportBtn").addEventListener("click", () => {
    if (colors.length === 0) {
      showMessage("Add at least one color before exporting.");
      return;
    }
    showMessage("");
    const size = 160;
    const canvas = document.createElement("canvas");
    canvas.width = size * colors.length;
    canvas.height = size;
    const ctx = canvas.getContext("2d");
    ctx.font = "bold 20px 'Trebuchet MS', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    colors.forEach((hex, i) => {
      ctx.fillStyle = hex;
      ctx.fillRect(i * size, 0, size, size);
      ctx.fillStyle = textColorFor(hex);
      ctx.fillText(hex, i * size + size / 2, size / 2);
    });
    const link = document.createElement("a");
    link.download = "palette.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });

  render();
</script>
</body>
</html>
