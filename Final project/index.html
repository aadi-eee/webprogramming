<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My final project</title>

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">

<style>
  :root { --paper:#fbf9f1; --ink:#1a1212; --pink:#f4c9e2; --butter:#f8ebb5; --maroon:#6b0f1a; --brown:#4a1f1d; }
  * { box-sizing: border-box; }
  body { margin:0; padding:40px 20px; background:var(--pink); color:var(--ink); font-family:"Instrument Serif",Georgia,serif; font-size:20px; }
  .card { max-width:640px; margin:0 auto; padding:40px 32px 48px; background:var(--paper); text-align:center; }
  .back { display:inline-block; margin-bottom:20px; font-size:16px; color:var(--maroon); }
  h1 { font-weight:400; font-size:clamp(2rem,7vw,3rem); line-height:1.1; margin:0 0 20px; }
  h1 .script { font-family:"Pinyon Script",cursive; font-size:1.2em; color:var(--maroon); }
  a:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  ul { list-style:none; margin:0; padding:0; }
  li { margin-bottom:14px; }
  li a { display:block; padding:10px 20px; background:var(--butter); border:1px dashed var(--ink); border-radius:99px; color:var(--ink); text-decoration:none; }
  li a:hover { background:var(--brown); color:var(--paper); }

  /* Highlighted: Launch app */
  li.launch { position:relative; margin:34px 0 26px; }
  li.launch a {
    padding:18px 24px;
    background:var(--maroon);
    color:#fff;
    border:2px solid var(--ink);
    font-size:28px;
    line-height:1.2;
    box-shadow:0 0 0 5px var(--pink), 4px 8px 0 rgba(26,18,18,.25);
    transition:transform .2s ease, box-shadow .2s ease;
    animation:glow 2.4s ease-in-out infinite;
  }
  li.launch a::after { content:" \2192"; }
  li.launch a:hover {
    background:var(--maroon);
    color:#fff;
    transform:translateY(-4px) scale(1.02);
    box-shadow:0 0 0 5px var(--butter), 4px 12px 0 rgba(26,18,18,.3);
    animation:none;
  }
  li.launch::before {
    content:"\2605  Start here";
    position:absolute;
    top:-16px;
    left:50%;
    transform:translateX(-50%) rotate(-3deg);
    z-index:1;
    background:var(--butter);
    color:var(--ink);
    border:1px dashed var(--ink);
    border-radius:99px;
    padding:0 14px;
    font-size:16px;
    white-space:nowrap;
  }
  @keyframes glow {
    0%,100% { box-shadow:0 0 0 5px var(--pink), 4px 8px 0 rgba(26,18,18,.25); }
    50%     { box-shadow:0 0 0 11px rgba(244,201,226,.55), 4px 8px 0 rgba(26,18,18,.25); }
  }
  @media (prefers-reduced-motion: reduce) {
    li.launch a { animation:none; }
  }
</style>
</head>
<body>
<main class="card">
  <a class="back" href="../index.html">&larr; Back to all assignments</a>
  <h1>My <span class="script">final</span> Project</h1>
  <ul>
    <li class="launch"><a href="https://kahlen2008.github.io/webprogproject/">Launch app</a></li>
    <li><a href="final.html">Proposal</a></li>
    <li><a href="https://github.com/kahlen2008/webprogproject">Github repository</a></li>
    <li><a href="https://drive.google.com/file/d/1fm30EHX9H_X3D-qCcLZ3_2O0gHvutgSQ/view">Video presentation</a></li>
  </ul>
</main>
</body>
</html>
