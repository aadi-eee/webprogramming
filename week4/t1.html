

<!DOCTYPE html>
<html>
<head>
    <title>Click Counter</title>
    <style>
        button {
            padding: 12px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .done {
            background-color: green;
        }
    </style>
</head>
<body>

    <h2>Click Counter</h2>

    <button id="countButton">Clicks: 0</button>
    <p id="message"></p>

    <script>
        const button = document.querySelector("#countButton");
        const message = document.querySelector("#message");

        let count = 0;

        button.addEventListener("click", function() {
            count++;

            button.textContent = "Clicks: " + count;

            if (count === 5) {
                button.classList.add("done");
                message.textContent = "Congratulations! You reached 5 clicks!";
            }
        });
    </script>

</body>
</html>
