<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root { --paper:#fbf9f1; --ink:#1a1212; --pink:#f4c9e2; --butter:#f8ebb5; --maroon:#6b0f1a; --brown:#4a1f1d; }
  * { box-sizing: border-box; }
  body { margin:0; padding:40px 20px; background:var(--pink); color:var(--ink); font-family:"Instrument Serif",Georgia,serif; font-size:20px; }
  .card { max-width:760px; margin:0 auto; padding:36px 28px 44px; background:var(--paper); text-align:center; }
  .back { display:inline-block; margin-bottom:20px; font-size:16px; color:var(--maroon); }
  h1 { font-weight:400; font-size:clamp(2rem,7vw,3rem); line-height:1.1; margin:0 0 12px; }
  h1 .script { font-family:"Pinyon Script",cursive; font-size:1.2em; color:var(--maroon); }
  .intro { margin:0 0 26px; }
  form { text-align:left; display:grid; gap:20px; }
  fieldset { min-width:0; margin:0; padding:20px; border:1px dashed var(--ink); border-radius:14px; background:#fffdf8; }
  legend { padding:0 10px; font-size:1.2em; }
  .fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
  .field { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .field.full { grid-column:1 / -1; }
  label { font-size:.95em; }
  .hint { font-size:.8em; color:#79575a; }
  input, select { width:100%; min-width:0; font:inherit; padding:8px 12px; border:1px dashed var(--ink); border-radius:10px; background:#fff; color:var(--ink); }
  input::placeholder { color:#8c7777; }
  input:focus, select:focus { outline:2px solid var(--maroon); outline-offset:2px; }
  input:not(:placeholder-shown):valid, select:valid { border-color:#557b48; }
  input:not(:placeholder-shown):invalid { border-color:var(--maroon); }
  select { cursor:pointer; }
  .range-row { display:flex; align-items:center; gap:12px; }
  input[type="range"] { padding:0; border:0; background:transparent; accent-color:var(--maroon); }
  output { display:inline-flex; justify-content:center; align-items:center; min-width:42px; padding:4px 10px; border-radius:99px; background:var(--butter); border:1px dashed var(--ink); }
  .terms { display:flex; align-items:flex-start; gap:10px; padding:14px 16px; background:var(--butter); border:1px dashed var(--ink); border-radius:14px; }
  .terms input { width:18px; height:18px; min-height:0; margin-top:7px; flex:0 0 auto; accent-color:var(--maroon); }
  .terms label { flex:1; }
  .actions { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; }
  button { font:inherit; padding:8px 18px; border:1px dashed var(--ink); border-radius:99px; background:var(--butter); color:var(--ink); cursor:pointer; }
  button:hover { background:var(--brown); color:var(--paper); }
  .reset { background:#fff; }
  .note { margin:0; text-align:center; color:var(--maroon); font-size:.85em; }
  @media (max-width:600px) {
    body { padding:24px 12px; font-size:18px; }
    .card { padding:28px 16px 32px; }
    fieldset { padding:16px 12px; }
    .fields { grid-template-columns:1fr; }
    .field.full { grid-column:auto; }
    .actions button { width:100%; }
  }
</style>
</head>
<body>
<div class="card">
  <a class="back" href="index.html">&larr; Back to Home</a>
  <h1>Student <span class="script">Registration</span></h1>
  <p class="intro">Fill in your details to register.</p>

  <form action="#" method="post">
    <fieldset>
      <legend>Personal Info</legend>
      <div class="fields">
        <div class="field">
          <label for="full-name">Full Name <span class="hint">(required)</span></label>
          <input id="full-name" name="fullName" type="text" placeholder="e.g. Alex Kim" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="student-id">Student ID <span class="hint">(9 digits, required)</span></label>
          <input id="student-id" name="studentId" type="text" inputmode="numeric" placeholder="123456789" pattern="\d{9}" title="Enter exactly 9 digits." required>
        </div>
        <div class="field">
          <label for="dob">Date of Birth</label>
          <input id="dob" name="dateOfBirth" type="date">
        </div>
        <div class="field">
          <label for="major">Major <span class="hint">(required)</span></label>
          <select id="major" name="major" required>
            <option value="" disabled selected>Select your major</option>
            <option value="computer-science">Computer Science</option>
            <option value="business">Business Administration</option>
            <option value="design">Design</option>
            <option value="engineering">Engineering</option>
            <option value="international-studies">International Studies</option>
          </select>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Account Info</legend>
      <div class="fields">
        <div class="field">
          <label for="email">Email <span class="hint">(required)</span></label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password <span class="hint">(min. 8 characters)</span></label>
          <input id="password" name="password" type="password" minlength="8" placeholder="Minimum 8 characters" autocomplete="new-password" required>
        </div>
        <div class="field full">
          <label for="phone">Phone <span class="hint">(format: 010-1234-5678)</span></label>
          <input id="phone" name="phone" type="text" inputmode="numeric" placeholder="010-1234-5678" pattern="\d{3}-\d{4}-\d{4}" title="Use the format 010-1234-5678." required>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Experience</legend>
      <div class="field">
        <label for="experience">Years of coding experience</label>
        <div class="range-row">
          <input id="experience" name="codingExperience" type="range" min="0" max="10" value="0">
          <output id="experience-value" for="experience">0</output>
        </div>
      </div>
    </fieldset>

    <div class="terms">
      <input id="terms" name="terms" type="checkbox" required>
      <label for="terms">I agree to the terms. <span class="hint">(required)</span></label>
    </div>

    <div class="actions">
      <button type="submit">Submit Registration</button>
      <button class="reset" type="reset">Reset Form</button>
    </div>
    <p class="note">Please check your details before submitting.</p>
  </form>
</div>

<script>
const experience = document.getElementById("experience");
const experienceValue = document.getElementById("experience-value");

function updateExperience() {
  experienceValue.value = experience.value;
  experienceValue.textContent = experience.value;
}

experience.addEventListener("input", updateExperience);
document.querySelector("form").addEventListener("reset", () => {
  setTimeout(updateExperience, 0);
});
updateExperience();
</script>
</body>
</html>
