
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Week 9 Deployment Practice</title>

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">

<style>
:root {
  --paper:#fbf9f1;
  --ink:#1a1212;
  --pink:#f4c9e2;
  --butter:#f8ebb5;
  --maroon:#6b0f1a;
  --brown:#4a1f1d;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  padding:40px 20px;
  background:var(--pink);
  color:var(--ink);
  font-family:"Instrument Serif",Georgia,serif;
  font-size:20px;
}

.card {
  max-width:1100px;
  margin:40px auto;
  padding:55px 48px;
  background:var(--paper);
  border:2px solid var(--ink);
  border-radius:18px;
  box-shadow:8px 8px 0 var(--ink);
  text-align:left;
}

h1 {
  font-weight:400;
  font-size:clamp(2.5rem,6vw,3.5rem);
  line-height:1.1;
  margin:0 0 18px;
  color:var(--ink);
}

h1 .script {
  font-family:"Pinyon Script",cursive;
  color:var(--maroon);
}

p {
  font-size:24px;
  line-height:1.6;
  margin:14px 0;
}

a {
  display:inline-block;
  margin-top:4px;
  color:var(--maroon);
  font-size:23px;
  text-decoration:underline;
}

a:hover {
  color:var(--brown);
}

@media(max-width:600px) {
  .card {
    padding:35px 25px;
  }

  p, a {
    font-size:19px;
  }
}
</style>
</head>

<body>

<div class="card">

  <h1>Aale Aaditi</h1>

  <p>
    Web Programming (K0126002), Gachon University
  </p>

  <p>
    Week 9 deployment practice, published on GitHub Pages.
  </p>

  <p>
    November 8, 2026
  </p>

  <a href="../index.html">My course site</a>

</div>

</body>
</html>
